<title>Escola do Ás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sala de cartas — trilho lateral de navegação sobre feltro escuro, conteúdo em coluna única legível; mesa oval na aba Mesa. */
:root {
  --felt: #0e2620;
  --felt-2: #133129;
  --felt-3: #1a3f34;
  --line: #2b5547;
  --ivory: #f2ebdb;
  --muted: #a3bab0;
  --faint: #6f8d81;
  --brass: #e0ab47;
  --brass-ink: #1d1606;
  --red: #e0645a;
  --good: #63c98f;
  --warn: #e7b651;
  --card-face: #fbf7ee;
  --suit-s: #1d2320;
  --suit-h: #c8302c;
  --suit-d: #2360c4;
  --suit-c: #1d8a45;
  --suit-d-l: #7fb0ff;
  --act-fold: #5b8def;
  --act-pass: #4fb383;
  --act-bet1: #e0ab47;
  --act-bet2: #e27a3c;
  --act-bet3: #d9534a;
  --act-allin: #a8456b;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--felt); color: var(--ivory); font: 16px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brass); }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
h4 { font-size: 1.02rem; font-weight: 700; margin-top: 1.4em; color: var(--brass); }
p { margin: 0.6em 0; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 0.72rem/1 var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* Shell */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; padding: 22px 16px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; background: var(--felt); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 38px; height: 50px; border-radius: 6px; background: var(--card-face); color: var(--suit-s); display: grid; place-items: center; font: 800 1.3rem/1 var(--font-display); box-shadow: 3px 3px 0 var(--brass); flex: none; }
.brand-mark small { display: block; font-size: 0.9rem; margin-top: -4px; }
.brand b { font: 800 1.15rem/1.1 var(--font-display); display: block; }
.brand span { font-size: 0.78rem; color: var(--muted); }
nav.tabs { display: flex; flex-direction: column; gap: 2px; }
nav.tabs button { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; color: var(--muted); cursor: pointer; font-weight: 700; }
nav.tabs button:hover { background: var(--felt-2); color: var(--ivory); }
nav.tabs button[aria-current="page"] { background: var(--felt-3); color: var(--ivory); box-shadow: inset 3px 0 0 var(--brass); }
.badge-count { font: 600 0.72rem/1 var(--font-mono); background: var(--brass); color: var(--brass-ink); border-radius: 99px; padding: 3px 7px; }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
main { padding-block: 32px 64px; padding-inline: clamp(16px, 4vw, 48px); min-width: 0; }
.wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 22px; }
.narrow { max-width: 720px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: auto; flex-direction: column; gap: 10px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand-mark { width: 28px; height: 36px; font-size: 1rem; box-shadow: 2px 2px 0 var(--brass); }
  .brand span, .rail-foot { display: none; }
  nav.tabs { flex-direction: row; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { flex: none; padding: 7px 11px; }
  nav.tabs button[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--brass); }
  main { padding-block: 20px 56px; }
}

/* Superfícies */
.panel { background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
[hidden] { display: none !important; }
.stack { display: grid; gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt-3); color: var(--ivory); font-weight: 700; cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--red); color: var(--red); background: transparent; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 0.74rem/1 var(--font-mono); padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.gold { border-color: var(--brass); color: var(--brass); }
.pill.good { border-color: var(--good); color: var(--good); }
.pill.bad { border-color: var(--red); color: var(--red); }
.pill.bad { border-color: var(--red); color: var(--red); }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.bar { height: 8px; background: var(--felt); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--brass); border-radius: 99px; }
.bar.good > i { background: var(--good); }
input[type=text], input[type=number], input[type=date], select, textarea { background: var(--felt); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; }
label.field { display: grid; gap: 5px; font-size: 0.88rem; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 0.8em 0; }
table.t th, table.t td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 0.72rem/1.3 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.scroll-x { overflow-x: auto; }

/* Cartas: baralho de 4 cores, padrão das salas online */
.card { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 42px; height: 58px; border-radius: 6px; background: var(--card-face); font: 700 1.15rem/1 var(--font-display); box-shadow: 0 2px 0 rgba(0,0,0,.35); margin: 0 3px 0 0; vertical-align: middle; }
.card i { font-style: normal; font-size: 1rem; line-height: 1; }
.card.sm { width: 32px; height: 44px; font-size: 0.95rem; }
.card.sm i { font-size: 0.8rem; }
.card.back { background: repeating-linear-gradient(45deg, #7a1f25 0 4px, #8f2a30 4px 8px); border: 2px solid var(--card-face); }
.card.s, .su-s { color: var(--suit-s); }
.card.h, .su-h { color: var(--suit-h); }
.card.d, .su-d { color: var(--suit-d); }
.card.c, .su-c { color: var(--suit-c); }
.inl { font-weight: 700; white-space: nowrap; }
.inl.su-s { color: var(--ivory); }
.inl.su-h { color: #ff7a6e; }
.inl.su-d { color: #7fb0ff; }
.inl.su-c { color: #6fd494; }

/* Mentor */
.mentor { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: start; }
.mentor .face { width: 52px; height: 52px; border-radius: 50%; background: var(--brass); color: var(--brass-ink); display: grid; place-items: center; font: 800 1.2rem/1 var(--font-display); }
.bubble { background: var(--felt-3); border: 1px solid var(--line); border-radius: 4px var(--r) var(--r) var(--r); padding: 14px 16px; min-width: 0; }
.bubble b.who { font: 600 0.72rem/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); display: block; margin-bottom: 6px; }

/* Home */
.hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
.stat { background: var(--felt-2); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; min-width: 0; }
.stat .v { font: 800 1.9rem/1 var(--font-display); }
.mission { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mission:last-child { border-bottom: 0; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.8rem; }
.check.on { background: var(--good); border-color: var(--good); color: var(--felt); }

/* Trilha */
.module { display: grid; gap: 12px; }
.module-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: baseline; }
.lesson-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--felt); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.lesson-row:hover:not(:disabled) { border-color: var(--brass); }
.lesson-row:disabled { cursor: not-allowed; opacity: 0.5; }
.lesson-row .n { font: 600 0.8rem/1 var(--font-mono); color: var(--muted); }
.lesson-row.done .n { color: var(--good); }
.lock { font-size: 0.8rem; color: var(--faint); }

/* Lição */
.lesson-body { font-size: 1.04rem; max-width: 68ch; }
.lesson-body ul, .lesson-body ol { padding-left: 1.3em; }
.lesson-body li { margin: 0.3em 0; }
.formula { font-family: var(--font-mono); background: var(--felt); border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; display: inline-block; }
.callout { border-left: 3px solid var(--brass); padding: 12px 16px; background: var(--felt-2); border-radius: 0 var(--r) var(--r) 0; }
.callout.example { border-left-color: var(--suit-d); }
/* lições em passos, "Pense antes de ler" e glossário ao toque */
.lstep { animation: stepin 0.35s ease; }
@keyframes stepin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .lstep { animation: none; } }
.step-nav { display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--felt-2); }
details.think { margin: 1em 0; border: 1px dashed var(--brass); border-radius: var(--r); background: var(--felt); }
details.think > summary { cursor: pointer; padding: 12px 16px; list-style: none; font-weight: 600; }
details.think > summary::-webkit-details-marker { display: none; }
details.think > summary > span { display: block; font: 700 0.72rem/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
details.think > summary::after { content: "Toque para ver a resposta"; display: block; margin-top: 6px; font-weight: 400; font-size: 0.85rem; color: var(--muted); }
details.think[open] > summary::after { content: "Resposta"; }
details.think > div { padding: 0 16px 12px; border-top: 1px dashed var(--line); }
button.term { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; text-decoration: underline dotted var(--brass); text-decoration-thickness: 2px; text-underline-offset: 3px; }
button.term:hover, button.term[aria-expanded="true"] { color: var(--brass); }
.term-def { display: block; margin: 6px 0 8px; padding: 8px 12px; border-left: 3px solid var(--brass); background: var(--felt); border-radius: 0 8px 8px 0; font-size: 0.92rem; font-weight: 400; color: var(--ivory); }
.term-def b { color: var(--brass); }
.glossary dt { font-weight: 700; margin-top: 10px; }
/* pacote 2: pistas socráticas e mapa de domínio */
.socratic .hint { margin: 0; padding: 8px 12px; border-left: 3px solid var(--brass); background: var(--felt); border-radius: 0 8px 8px 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) auto; gap: 10px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.mrow:first-of-type { border-top: 0; }
.mrow.locked { opacity: 0.55; }
.mbars { display: grid; gap: 4px; }
.mbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.mbar .bar { margin: 0; }
@media (max-width: 720px) { .mrow { grid-template-columns: 1fr; } }
.spot, .worked { margin: 1.2em 0; border-color: var(--brass); }
.spot-table { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; padding: 12px; border-radius: 10px; background: var(--felt); border: 1px solid var(--line); }
.spot-table .lbl { display: block; margin-bottom: 6px; }
.spot-nums { display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: baseline; margin-left: auto; }
.spot-q { font: 700 1.08rem/1.35 var(--font-display); margin: 0; }
.opt.meh { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, var(--felt)); }
.callout.ok { border-left-color: var(--good); }
.callout.bad { border-left-color: var(--red); }
.callout.pre { border-left-color: var(--warn); }
.whynot { padding: 8px 12px; border-left: 3px solid var(--line); font-size: 0.95rem; }
.wsteps { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
.wstep > div { margin-top: 4px; }
.wstep.ask { padding: 10px 12px; border: 1px dashed var(--brass); border-radius: 10px; }
.glossary dd { margin: 2px 0 0; color: var(--muted); }
.callout .eyebrow { display: block; margin-bottom: 6px; }

/* Grade de mãos */
.rgrid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 2px; max-width: 460px; font: 600 clamp(0.5rem, 1.9vw, 0.7rem)/1 var(--font-mono); }
.rgrid span { aspect-ratio: 1; display: grid; place-items: center; border-radius: 3px; background: var(--felt); color: var(--faint); }
.rgrid span.in { background: var(--brass); color: var(--brass-ink); }
.rgrid span.hl { outline: 2px solid var(--ivory); outline-offset: 1px; position: relative; z-index: 1; }
.rgrid span.hl:not(.in) { background: var(--red); color: var(--ivory); }
.range-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.range-tabs button { background: var(--felt); border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-weight: 700; }
.range-tabs button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }

/* Quiz / runner */
.runner { display: grid; gap: 18px; }
.runner-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.prompt { font-size: 1.1rem; }
.prompt .lead { font: 700 1.2rem/1.3 var(--font-display); margin: 0 0 12px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; padding: 13px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--felt); cursor: pointer; font-weight: 700; display: flex; gap: 12px; align-items: center; }
.opt:hover:not(:disabled) { border-color: var(--brass); }
.opt .k { font: 600 0.75rem/1 var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--felt)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--felt)); }
.opt:disabled { cursor: default; }
.opts.two { grid-template-columns: 1fr 1fr; }
.feedback { border-radius: 10px; padding: 14px 16px; background: var(--felt-3); border: 1px solid var(--line); }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--red); }
.board, .duel { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 8px 0; }
.duel > div { display: grid; gap: 6px; }
.lbl { font: 600 0.72rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Treinos */
.drill { display: grid; gap: 10px; align-content: start; }
.drill .acc { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); }

/* Mesa */
.table-wrap { position: relative; width: 100%; max-width: 820px; margin: 0 auto; aspect-ratio: 16 / 10; min-height: 340px; }
.oval { position: absolute; inset: 11% 8%; border-radius: 50% / 46%; background: radial-gradient(ellipse at 50% 40%, #226b4f 0%, #17503b 60%, #10392b 100%); border: 10px solid #4a2d1a; box-shadow: inset 0 0 0 2px #6b4527, 0 12px 30px rgba(0,0,0,.4); }
.center { position: absolute; left: 50%; top: 47%; transform: translate(-50%, -50%); display: grid; gap: 8px; justify-items: center; text-align: center; }
.center .board { min-height: 58px; }
.center .pot { font: 600 0.85rem/1 var(--font-mono); background: rgba(0,0,0,.35); padding: 5px 10px; border-radius: 99px; }
.seat { position: absolute; transform: translate(-50%, -50%); width: clamp(88px, 17%, 138px); display: grid; gap: 4px; justify-items: center; text-align: center; }
.seat .cards { display: flex; min-height: 44px; }
.seat .plate { background: var(--felt); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; width: 100%; display: grid; gap: 2px; }
.seat .plate b { font-size: 0.82rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat .plate .mono { font-size: 0.78rem; }
.seat.turn .plate { border-color: var(--brass); box-shadow: 0 0 0 2px var(--brass); }
.seat.folded { opacity: 0.4; }
.seat.win .plate { border-color: var(--good); box-shadow: 0 0 0 2px var(--good); }
.seat .betchip { font: 600 0.74rem/1 var(--font-mono); background: var(--brass); color: var(--brass-ink); border-radius: 99px; padding: 3px 8px; }
.pos { font: 600 0.62rem/1 var(--font-mono); color: var(--brass); letter-spacing: 0.06em; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.coach-feed { display: grid; gap: 8px; max-height: 260px; overflow-y: auto; }
.coach-item { border-left: 3px solid var(--line); padding: 6px 10px; background: var(--felt); border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.coach-item.good { border-color: var(--good); }
.coach-item.ok { border-color: var(--warn); }
.coach-item.bad { border-color: var(--red); }
.log { font: 0.8rem/1.5 var(--font-mono); color: var(--muted); max-height: 220px; overflow-y: auto; }
@media (max-width: 560px) {
  .table-wrap { aspect-ratio: 3 / 4; min-height: 440px; margin-top: 40px; }
  .oval { inset: 12% 6%; border-radius: 46% / 50%; border-width: 7px; }
  .card { width: 36px; height: 50px; font-size: 1rem; }
  .seat .cards .card { width: 26px; height: 36px; font-size: 0.78rem; }
  .seat .cards .card i { font-size: 0.65rem; }
}

/* Evolução */
.ipp-hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
.ipp-num { font: 800 clamp(3.4rem, 9vw, 5.4rem)/0.9 var(--font-display); color: var(--brass); }
.ladder { display: flex; gap: 4px; flex-wrap: wrap; }
.ladder span { flex: 1 1 80px; font: 600 0.68rem/1.2 var(--font-mono); padding: 6px; border-radius: 6px; background: var(--felt); color: var(--faint); border: 1px solid var(--line); text-align: center; }
.ladder span.on { color: var(--ivory); border-color: var(--brass); }
.ladder span.cur { background: var(--brass); color: var(--brass-ink); border-color: var(--brass); }
.crit { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crit:last-child { border-bottom: 0; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.bdg { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 4px; background: var(--felt); }
.bdg.off { opacity: 0.4; }
.bdg .ico { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--felt-3); color: var(--brass); font: 800 0.9rem/1 var(--font-display); border: 1px solid var(--brass); }
